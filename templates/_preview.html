{% load static %}
<div class="place-preview">
    <img src="{% static 'default.jpg' %}" class="preview_img">
    <div class="info">
        <h2><a href="{% url 'places:place_detail' place.id %}">{{ place.name }}</a></h2>
        <p>{{ place.description|truncatewords:10 }}</p>
        <p>{{ place.short_description }}</p>
        <p>Локація: {{ place.location|default:"Secret place👀" }}</p>
        <p style="color:orange;">{% for i in "12345" %}
            {% if forloop.counter <= place.rating %}★{% endif %}
        {% endfor %}</p>
    </div>
</div>
<hr>
